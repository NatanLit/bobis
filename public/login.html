<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Войти</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #FF6B35; --accent-d: #E85A26;
      --accent-10: rgba(255,107,53,.1); --accent-20: rgba(255,107,53,.2);
      --success: #22C55E; --danger: #EF4444;
      --r: 22px; --r-btn: 18px; --r-input: 14px;
    }
    [data-theme="dark"] {
      --bg: #141210; --card: #1E1B17; --card-b: #2A2520;
      --text1: #F5F0EB; --text2: #7A7068; --text3: #3D3830;
      --input-bg: #252118; --input-b: #332E25;
    }
    [data-theme="light"] {
      --bg: #FAF8F5; --card: #FFFFFF; --card-b: #EAE6DF;
      --text1: #1A1612; --text2: #7A7068; --text3: #C0B8AE;
      --input-bg: #F7F4EF; --input-b: #E4DDD5;
    }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg); color: var(--text1);
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 360px; width: 100%; }

    .logo {
      width: 72px; height: 72px; border-radius: 22px;
      background: var(--accent); margin: 0 auto 28px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(255,107,53,.3);
      animation: pop .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .logo svg { width: 36px; height: 36px; color: #fff; }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .title {
      font-size: 26px; font-weight: 900; letter-spacing: -.03em;
      text-align: center; margin-bottom: 6px;
      animation: fadeUp .4s .1s cubic-bezier(.22,1,.36,1) both;
    }
    .subtitle {
      font-size: 14px; color: var(--text2); text-align: center;
      line-height: 1.5; margin-bottom: 32px;
      animation: fadeUp .4s .15s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .card {
      background: var(--card); border: 1px solid var(--card-b);
      border-radius: var(--r); padding: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 20px rgba(0,0,0,.07);
      animation: fadeUp .4s .2s cubic-bezier(.22,1,.36,1) both;
    }

    .field-lbl {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text2); margin-bottom: 8px;
    }
    .input {
      width: 100%; height: 52px;
      background: var(--input-bg); border: 1px solid var(--input-b);
      border-radius: var(--r-input); padding: 0 16px;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 16px; font-weight: 500; color: var(--text1);
      outline: none; -webkit-appearance: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-10);
    }
    .input::placeholder { color: var(--text3); }

    .hint {
      font-size: 12px; color: var(--text2); margin-top: 8px; line-height: 1.4;
    }

    .btn {
      width: 100%; height: 52px; border: none; border-radius: var(--r-btn);
      background: var(--accent); color: #fff;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 16px; font-weight: 700; letter-spacing: -.01em;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; margin-top: 20px;
      box-shadow: 0 4px 20px rgba(255,107,53,.3);
      transition: transform .15s, background .15s, opacity .15s;
    }
    .btn:active { transform: scale(.97); background: var(--accent-d); }
    .btn:disabled { opacity: .4; cursor: default; }

    .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .err { font-size: 13px; font-weight: 600; color: var(--danger); text-align: center; margin-top: 10px; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--text3); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--card-b);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
    </div>

    <div class="title">Добро пожаловать</div>
    <div class="subtitle">Введите номер телефона чтобы<br>копить поинты за отзывы</div>

    <div class="card">
      <div class="field-lbl">Номер телефона</div>
      <input class="input" id="phone-input" type="tel"
        placeholder="+7 (___) ___-__-__"
        autocomplete="tel" inputmode="tel">
      <div class="hint">На этот номер будут начисляться поинты</div>

      <button class="btn" id="btn" onclick="handleLogin()">
        Продолжить
      </button>
      <div class="err" id="err-msg"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('phone-input');
    const btn   = document.getElementById('btn');
    const err   = document.getElementById('err-msg');

    // Если уже залогинен — редирект
    const saved = localStorage.getItem('user_phone');
    if (saved) redirectBack();

    // Форматирование номера
    input.addEventListener('input', () => {
      let v = input.value.replace(/\D/g, '');
      if (v.startsWith('8')) v = '7' + v.slice(1);
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length === 0)       input.value = '';
      else if (v.length <= 1)   input.value = '+' + v;
      else if (v.length <= 4)   input.value = '+' + v[0] + ' (' + v.slice(1);
      else if (v.length <= 7)   input.value = '+' + v[0] + ' (' + v.slice(1,4) + ') ' + v.slice(4);
      else if (v.length <= 9)   input.value = '+' + v[0] + ' (' + v.slice(1,4) + ') ' + v.slice(4,7) + '-' + v.slice(7);
      else                      input.value = '+' + v[0] + ' (' + v.slice(1,4) + ') ' + v.slice(4,7) + '-' + v.slice(7,9) + '-' + v.slice(9);
      err.textContent = '';
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    function handleLogin() {
      const digits = input.value.replace(/\D/g, '');
      if (digits.length < 11) {
        err.textContent = 'Введите полный номер телефона';
        input.focus();
        return;
      }
      const phone = '+' + digits;
      localStorage.setItem('user_phone', phone);
      redirectBack();
    }

    function redirectBack() {
      const params = new URLSearchParams(location.search);
      const next   = params.get('next') || '/';
      location.href = next;
    }
  </script>
</body>
</html>
