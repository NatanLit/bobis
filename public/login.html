<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Войти / Зарегистрироваться</title>
  <script>
    // Apply saved theme before paint to avoid flash
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --accent: #FF6B35; --accent-d: #E85A26;
      --accent-10: rgba(255,107,53,.1); --accent-20: rgba(255,107,53,.2);
      --success: #22C55E; --danger: #EF4444;
      --r: 22px; --r-btn: 18px; --r-input: 14px;
    }
    [data-theme="dark"] {
      --bg: #141210; --card: #1E1B17; --card-b: #2A2520;
      --text1: #F5F0EB; --text2: #7A7068; --text3: #3D3830;
      --input-bg: #252118; --input-b: #332E25;
    }
    [data-theme="light"] {
      --bg: #FAF8F5; --card: #FFFFFF; --card-b: #EAE6DF;
      --text1: #1A1612; --text2: #7A7068; --text3: #C0B8AE;
      --input-bg: #F7F4EF; --input-b: #E4DDD5;
    }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg); color: var(--text1);
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 360px; width: 100%; }

    .logo {
      width: 72px; height: 72px; border-radius: 22px;
      background: var(--accent); margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(255,107,53,.3);
      animation: pop .5s cubic-bezier(.34,1.56,.64,1) both;
    }
    .logo svg { width: 36px; height: 36px; color: #fff; }
    @keyframes pop { from { transform: scale(0); opacity: 0; } }

    .title { font-size: 26px; font-weight: 900; letter-spacing: -.03em; text-align: center; margin-bottom: 6px; animation: fadeUp .4s .1s both; }
    .subtitle { font-size: 14px; color: var(--text2); text-align: center; line-height: 1.5; margin-bottom: 24px; animation: fadeUp .4s .15s both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    /* Tabs */
    .tabs { display: flex; background: var(--card); border: 1px solid var(--card-b); border-radius: 16px; padding: 4px; margin-bottom: 16px; animation: fadeUp .4s .18s both; }
    .tab { flex: 1; height: 40px; border: none; border-radius: 12px; background: transparent; color: var(--text2); font-family: 'Outfit', system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
    .tab.active { background: var(--accent); color: #fff; }

    .card {
      background: var(--card); border: 1px solid var(--card-b);
      border-radius: var(--r); padding: 24px;
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 20px rgba(0,0,0,.07);
      animation: fadeUp .4s .2s both;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .field { margin-bottom: 14px; }
    .field:last-of-type { margin-bottom: 0; }
    .field-lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); margin-bottom: 7px; }
    .input {
      width: 100%; height: 50px;
      background: var(--input-bg); border: 1px solid var(--input-b);
      border-radius: var(--r-input); padding: 0 14px;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 16px; font-weight: 500; color: var(--text1);
      outline: none; -webkit-appearance: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-10); }
    .input::placeholder { color: var(--text3); font-size: 14px; }

    .btn {
      width: 100%; height: 52px; border: none; border-radius: var(--r-btn);
      background: var(--accent); color: #fff;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 16px; font-weight: 700; letter-spacing: -.01em;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; margin-top: 18px;
      box-shadow: 0 4px 20px rgba(255,107,53,.3);
      transition: transform .15s, background .15s, opacity .15s;
    }
    .btn:active { transform: scale(.97); background: var(--accent-d); }
    .btn:disabled { opacity: .4; cursor: default; }

    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg { font-size: 13px; font-weight: 600; text-align: center; margin-top: 12px; min-height: 18px; }
    .msg.err { color: var(--danger); }
    .msg.ok  { color: var(--success); }

    .form { display: none; }
    .form.active { display: block; }

    /* Theme toggle in top-right corner */
    .theme-btn {
      position: fixed; top: 16px; right: 16px;
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--card-b);
      cursor: pointer; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .15s;
      padding: 0;
    }
    .theme-btn:active { transform: scale(.92); }
    .theme-btn svg { width: 18px; height: 18px; color: var(--text2); }
    .theme-btn .ico-sun  { display: none; }
    .theme-btn .ico-moon { display: block; }
    [data-theme="light"] .theme-btn .ico-sun  { display: block; }
    [data-theme="light"] .theme-btn .ico-moon { display: none; }
  </style>
</head>
<body>
  <button class="theme-btn" onclick="toggleTheme()" aria-label="Переключить тему">
    <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
    </div>
    <div class="title" id="main-title">Добро пожаловать</div>
    <div class="subtitle" id="main-sub">Копите поинты за отзывы</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Войти</button>
      <button class="tab"        onclick="switchTab('register')">Регистрация</button>
    </div>

    <div class="card">

      <!-- LOGIN FORM -->
      <form class="form active" id="form-login" onsubmit="handleLogin(event)">
        <div class="field">
          <div class="field-lbl">Email</div>
          <input class="input" id="l-email" type="email" placeholder="example@mail.com" autocomplete="email" required>
        </div>
        <div class="field">
          <div class="field-lbl">Пароль</div>
          <input class="input" id="l-pwd" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="btn" type="submit" id="btn-login">Войти</button>
        <div class="msg" id="msg-login"></div>
      </form>

      <!-- REGISTER FORM -->
      <form class="form" id="form-register" onsubmit="handleRegister(event)">
        <div class="row2">
          <div class="field">
            <div class="field-lbl">Имя</div>
            <input class="input" id="r-fname" type="text" placeholder="Иван" autocomplete="given-name" required>
          </div>
          <div class="field">
            <div class="field-lbl">Фамилия</div>
            <input class="input" id="r-lname" type="text" placeholder="Иванов" autocomplete="family-name" required>
          </div>
        </div>
        <div class="field" style="margin-top:14px">
          <div class="field-lbl">Email</div>
          <input class="input" id="r-email" type="email" placeholder="example@mail.com" autocomplete="email" required>
        </div>
        <div class="field">
          <div class="field-lbl">Телефон <span style="color:var(--text3);font-weight:400">(необязательно)</span></div>
          <input class="input" id="r-phone" type="tel" placeholder="+7 (___) ___-__-__" autocomplete="tel">
        </div>
        <div class="field">
          <div class="field-lbl">Пароль</div>
          <input class="input" id="r-pwd" type="password" placeholder="Минимум 6 символов" autocomplete="new-password" required minlength="6">
        </div>
        <button class="btn" type="submit" id="btn-register">Создать аккаунт</button>
        <div class="msg" id="msg-register"></div>
      </form>

    </div>
  </div>

  <script>
    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    const SUPABASE_URL = 'https://jtzmekaeyggbyodgtybl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_H0ssO-N5HaRdTAZpT3UaSQ_EDtis45e';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Если уже авторизован — редиректим
    sb.auth.getSession().then(({ data }) => {
      if (data.session) redirectBack();
    });

    function redirectBack() {
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (tab === 'login')));
      document.getElementById('form-login').classList.toggle('active', tab === 'login');
      document.getElementById('form-register').classList.toggle('active', tab === 'register');
      document.getElementById('main-title').textContent = tab === 'login' ? 'Добро пожаловать' : 'Создать аккаунт';
      document.getElementById('main-sub').textContent   = tab === 'login' ? 'Копите поинты за отзывы' : 'Заполните данные для регистрации';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const msg = document.getElementById('msg-login');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';
      msg.className = 'msg'; msg.textContent = '';

      const { error } = await sb.auth.signInWithPassword({
        email:    document.getElementById('l-email').value.trim(),
        password: document.getElementById('l-pwd').value,
      });

      if (error) {
        msg.className = 'msg err';
        msg.textContent = error.message.includes('Invalid') ? 'Неверный email или пароль' : error.message;
        btn.disabled = false; btn.textContent = 'Войти';
      } else {
        msg.className = 'msg ok'; msg.textContent = 'Входим...';
        redirectBack();
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-register');
      const msg = document.getElementById('msg-register');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';
      msg.className = 'msg'; msg.textContent = '';

      const firstName = document.getElementById('r-fname').value.trim();
      const lastName  = document.getElementById('r-lname').value.trim();
      const email     = document.getElementById('r-email').value.trim();
      const phone     = document.getElementById('r-phone').value.trim();
      const password  = document.getElementById('r-pwd').value;

      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { first_name: firstName, last_name: lastName, phone } }
      });

      if (error) {
        msg.className = 'msg err';
        msg.textContent = error.message.includes('already') ? 'Email уже зарегистрирован' : error.message;
        btn.disabled = false; btn.textContent = 'Создать аккаунт';
        return;
      }

      // Создаём профиль в таблице profiles
      if (data.user) {
        await sb.from('profiles').upsert({
          id: data.user.id,
          first_name: firstName,
          last_name:  lastName,
          phone:      phone || null,
        });
        // Сохраняем имя локально для быстрого отображения
        localStorage.setItem('user_name', `${firstName} ${lastName}`);
      }

      msg.className = 'msg ok';
      msg.textContent = 'Аккаунт создан! Проверьте email для подтверждения.';
      setTimeout(redirectBack, 1500);
    }
  </script>
</body>
</html>
