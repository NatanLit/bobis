<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bobis — Админ панель</title>
  <meta name="description" content="Панель управления отзывами и статистикой товаров Bobis">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="admin-styles.css">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','Manrope','sans-serif'] } } }
    }
  </script>
</head>
<body>
  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Sidebar -->
  <aside class="sidebar fixed top-0 left-0 bottom-0 w-[260px] z-40 flex flex-col">
    <div class="p-6 pb-4">
      <div class="flex items-center gap-3 mb-1">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:var(--accent)">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
          </svg>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-4 space-y-1">
      <a class="sidebar-link active" id="nav-dashboard" onclick="switchSection('dashboard')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Дашборд
      </a>
      <a class="sidebar-link" id="nav-reviews" onclick="switchSection('reviews')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        Отзывы
      </a>
      <a class="sidebar-link" id="nav-products" onclick="switchSection('products')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Товары
      </a>
      <a class="sidebar-link" id="nav-qr" onclick="switchSection('qr')">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 17h2m4 0v4m-4 0h4m0-4v-2m-6-2h2m0-2h2m2 0v2"/></svg>
        QR-коды
      </a>
    </nav>

    <div class="px-4 pb-6">
      <div class="flex items-center justify-between px-3 py-2">
        <span class="text-xs font-semibold" style="color:var(--text-tertiary)">Тема</span>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()"></button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content" style="margin-left:260px">
    <!-- Top bar -->
    <header class="top-bar sticky top-0 z-30">
      <div class="px-8 py-4 flex items-center justify-between min-h-[64px]">
        <div>
          <h2 class="text-xl font-bold" style="color:var(--text)" id="page-title"></h2>
          <p class="text-sm" style="color:var(--text-tertiary)" id="page-subtitle"></p>
        </div>
      </div>
    </header>

    <!-- Sections Container -->
    <div id="sections-container">
      <!-- DASHBOARD SECTION -->
      <div id="section-dashboard" class="section-content px-8 py-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="stats-grid"></div>
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
          <div class="dash-card lg:col-span-2 p-6 animate-fade-up" style="animation-delay:0.3s">
            <h3 class="text-sm font-bold uppercase tracking-wider mb-5" style="color:var(--text-tertiary)">Распределение оценок</h3>
            <div class="space-y-3" id="rating-bars"></div>
            <div class="mt-5 pt-4" style="border-top:1px solid var(--border)">
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold" style="color:var(--text-tertiary)">Средний балл</span>
                <div class="flex items-center gap-2">
                  <span class="text-2xl font-extrabold" style="color:var(--accent)" id="avg-score">0.0</span>
                  <span class="text-xs" style="color:var(--text-tertiary)">/ 5</span>
                </div>
              </div>
            </div>
          </div>
          <div class="dash-card lg:col-span-3 animate-fade-up overflow-hidden" style="animation-delay:0.4s">
            <div class="px-6 pt-6 pb-4 flex items-center justify-between">
              <h3 class="text-sm font-bold uppercase tracking-wider" style="color:var(--text-tertiary)">Последние отзывы</h3>
              <span class="text-xs font-semibold px-3 py-1 rounded-full" style="background:var(--accent-light);color:var(--accent)">Сегодня: 12</span>
            </div>
            <div id="reviews-list-dash" class="max-h-[420px] overflow-y-auto"></div>
          </div>
        </div>
        <div class="dash-card animate-fade-up overflow-hidden" style="animation-delay:0.5s">
          <div class="px-6 pt-6 pb-4 flex items-center justify-between">
            <h3 class="text-sm font-bold uppercase tracking-wider" style="color:var(--text-tertiary)">Баллы по товарам</h3>
            <div class="flex gap-2">
              <span class="score-badge score-high"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L9 9.414V13a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414-1.414z" clip-rule="evenodd"/></svg>Отлично</span>
              <span class="score-badge score-mid">Средне</span>
              <span class="score-badge score-low">Плохо</span>
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="data-table" id="products-table">
              <thead><tr><th>Товар</th><th>Отзывов</th><th>Средняя оценка</th><th>Рейтинг</th><th>Тренд</th></tr></thead>
              <tbody id="products-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- REVIEWS SECTION -->
      <div id="section-reviews" class="section-content px-8 py-6 space-y-6" style="display:none">
        <div class="flex flex-wrap items-center gap-3 mb-2">
          <button class="filter-pill active" onclick="filterReviews(0,this)">Все</button>
          <button class="filter-pill" onclick="filterReviews(5,this)">⭐ 5</button>
          <button class="filter-pill" onclick="filterReviews(4,this)">⭐ 4</button>
          <button class="filter-pill" onclick="filterReviews(3,this)">⭐ 3</button>
          <button class="filter-pill" onclick="filterReviews(2,this)">⭐ 2</button>
          <button class="filter-pill" onclick="filterReviews(1,this)">⭐ 1</button>
        </div>
        <div id="reviews-full-list" class="space-y-4"></div>
      </div>

      <!-- PRODUCTS SECTION -->
      <div id="section-products" class="section-content px-8 py-6" style="display:none">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="products-grid"></div>
      </div>
      <!-- QR SECTION -->
      <div id="section-qr" class="section-content px-8 py-6" style="display:none">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Form card -->
          <div class="dash-card p-6 animate-fade-up">
            <h3 class="text-sm font-bold uppercase tracking-wider mb-5" style="color:var(--text-tertiary)">Параметры заказа</h3>

            <div class="mb-4">
              <label class="block text-xs font-bold uppercase tracking-wider mb-2" style="color:var(--text-tertiary)">ID магазина / точки</label>
              <input id="qr-shop" type="text" placeholder="например: shop1"
                class="w-full h-11 rounded-xl px-4 text-sm font-medium outline-none transition-all"
                style="background:var(--input-bg);border:1px solid var(--border);color:var(--text);font-family:inherit">
            </div>

            <div class="mb-3">
              <label class="block text-xs font-bold uppercase tracking-wider mb-2" style="color:var(--text-tertiary)">Товары в заказе</label>
              <div id="qr-items-list" class="space-y-2 mb-2"></div>
              <button onclick="qrAddItem()"
                class="w-full h-10 rounded-xl text-sm font-semibold transition-all"
                style="border:1.5px dashed var(--border);background:transparent;color:var(--text-tertiary);font-family:inherit;cursor:pointer"
                onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
                onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-tertiary)'">
                + Добавить товар
              </button>
            </div>

            <button onclick="qrGenerate()"
              class="w-full h-11 rounded-xl text-sm font-bold mt-4 transition-all"
              style="background:var(--accent);color:#fff;border:none;font-family:inherit;cursor:pointer;box-shadow:0 4px 16px rgba(255,107,53,.3)"
              onmouseover="this.style.opacity='.9'" onmouseout="this.style.opacity='1'">
              Сгенерировать QR-код
            </button>
          </div>

          <!-- QR Result card -->
          <div class="dash-card p-6 animate-fade-up flex flex-col items-center justify-center" id="qr-result-card">
            <div id="qr-placeholder" class="text-center">
              <div class="w-20 h-20 rounded-2xl mx-auto mb-4 flex items-center justify-center" style="background:var(--bg)">
                <svg class="w-9 h-9" style="color:var(--text-tertiary)" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 17h2m4 0v4m-4 0h4m0-4v-2m-6-2h2m0-2h2m2 0v2"/>
                </svg>
              </div>
              <p class="text-sm font-semibold" style="color:var(--text-tertiary)">QR-код появится здесь</p>
              <p class="text-xs mt-1" style="color:var(--text-tertiary);opacity:.6">Заполните форму и нажмите кнопку</p>
            </div>
            <div id="qr-output" class="hidden flex-col items-center gap-4 w-full">
              <div id="qr-canvas-wrap" class="rounded-2xl p-4" style="background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.15)"></div>
              <div class="w-full space-y-1">
                <div class="text-xs font-bold uppercase tracking-wider mb-1" style="color:var(--text-tertiary)">Ссылка</div>
                <div id="qr-url-text" class="text-xs rounded-xl px-3 py-2 break-all leading-relaxed" style="background:var(--bg);color:var(--text-tertiary);border:1px solid var(--border)"></div>
              </div>
              <div class="flex gap-2 w-full">
                <button onclick="qrCopy()" class="flex-1 h-9 rounded-xl text-xs font-bold transition-all"
                  style="background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:inherit;cursor:pointer">
                  Копировать
                </button>
                <button onclick="window.print()" class="flex-1 h-9 rounded-xl text-xs font-bold transition-all"
                  style="background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:inherit;cursor:pointer">
                  Печать
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    if (sessionStorage.getItem('admin_auth') !== '1') location.href = '/admin-login.html';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
