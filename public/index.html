<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>Оставить отзыв</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --accent:    #FF6B35;
      --accent-d:  #E85A26;
      --accent-10: rgba(255,107,53,.1);
      --accent-20: rgba(255,107,53,.2);
      --star:      #FF6B35;
      --success:   #22C55E;
      --danger:    #EF4444;
      --r-card:    22px;
      --r-btn:     18px;
      --r-input:   14px;
    }

    [data-theme="dark"] {
      --bg:        #141210;
      --bg2:       #1C1A17;
      --card:      #1E1B17;
      --card-b:    #2A2520;
      --text1:     #F5F0EB;
      --text2:     #7A7068;
      --text3:     #3D3830;
      --input-bg:  #252118;
      --input-b:   #332E25;
      --sep:       #252118;
      --hdr:       rgba(20,18,16,.85);
    }

    [data-theme="light"] {
      --bg:        #FAF8F5;
      --bg2:       #F2EFE9;
      --card:      #FFFFFF;
      --card-b:    #EAE6DF;
      --text1:     #1A1612;
      --text2:     #7A7068;
      --text3:     #C0B8AE;
      --input-bg:  #F7F4EF;
      --input-b:   #E4DDD5;
      --sep:       #F0EDE8;
      --hdr:       rgba(250,248,245,.88);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text1);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 360px) {
      .header-title { font-size: 15px; }
      .header-shop  { font-size: 9px; }
      .counter-pill { font-size: 11px; padding: 3px 9px; }
      .profile-btn  { width: 38px; height: 38px; border-radius: 11px; }
      .profile-btn svg { width: 18px; height: 18px; }
      .main         { padding: 12px 10px; gap: 10px; }
      .card-top     { padding: 14px 14px 12px; }
      .card-name    { font-size: 15px; }
      .stars-section{ padding: 12px 14px 10px; }
      .star-btn     { width: 40px; height: 40px; border-radius: 11px; }
      .star-btn svg { width: 20px; height: 20px; }
    }
    @media (min-width: 430px) {
      .header-title { font-size: 19px; }
      .card-name    { font-size: 18px; }
      .star-btn     { width: 50px; height: 50px; }
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: var(--hdr);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid var(--sep);
      padding-top: env(safe-area-inset-top);
      transition: background .25s ease, border-color .25s ease;
    }
    .header-body {
      max-width: 480px; margin: 0 auto;
      padding: 12px 18px 10px;
      display: flex; align-items: center; gap: 14px;
    }

    /* Orange dot logo */
    .logo-dot {
      width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-dot svg { width: 18px; height: 18px; color: #fff; }

    .header-info { flex: 1; min-width: 0; }
    .header-shop {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 1px;
    }
    .header-title {
      font-size: 17px; font-weight: 700; letter-spacing: -.02em; color: var(--text1);
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    /* Profile button — shows points number inside */
    .profile-link {
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; cursor: pointer; flex-shrink: 0;
      transition: transform .15s ease;
    }
    .profile-link:active { transform: scale(.88); }
    .profile-btn {
      width: 48px; height: 48px; border-radius: 14px; border: none;
      background: var(--accent);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1px; filter: none; transition: filter .15s ease;
    }
    .profile-link:active .profile-btn { filter: brightness(.88); }
    /* Icon shown when no points */
    .profile-btn-ico { width: 20px; height: 20px; color: #fff; }
    /* Number shown when has points */
    .profile-btn-num {
      font-size: 17px; font-weight: 900; color: #fff;
      letter-spacing: -.03em; line-height: 1;
    }
    .profile-btn-sub {
      font-size: 8px; font-weight: 700; color: rgba(255,255,255,.75);
      letter-spacing: .04em; text-transform: uppercase; line-height: 1;
    }

    .counter-pill {
      background: var(--accent-10); border: 1px solid var(--accent-20);
      border-radius: 99px; padding: 4px 12px;
      font-size: 13px; font-weight: 700; color: var(--accent);
      letter-spacing: -.01em; white-space: nowrap;
    }

    .theme-toggle {
      width: 34px; height: 34px; border-radius: 10px; border: none; cursor: pointer;
      background: var(--input-bg); border: 1px solid var(--input-b);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .15s ease;
      flex-shrink: 0;
    }
    .theme-toggle:active { transform: scale(.88); }
    .theme-toggle svg { width: 15px; height: 15px; color: var(--text2); }

    /* Progress bar */
    .progress-bar-wrap {
      max-width: 480px; margin: 0 auto;
      padding: 0 18px 10px;
    }
    .progress-track {
      height: 3px; background: var(--sep); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent); border-radius: 99px;
      transition: width .55s cubic-bezier(.34,1.2,.64,1);
    }

    /* ── CARDS ──────────────────────────────────────────────── */
    .main {
      max-width: 480px; margin: 0 auto;
      padding: 16px 14px; display: flex; flex-direction: column; gap: 12px;
    }

    .card {
      background: var(--card); border: 1px solid var(--card-b);
      border-radius: var(--r-card);
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 20px rgba(0,0,0,.07);
      overflow: hidden;
      opacity: 0; transform: translateY(16px);
      animation: slideIn .45s cubic-bezier(.22,1,.36,1) forwards;
      transition: border-color .3s ease, box-shadow .3s ease,
                  background .25s ease;
    }
    .card.done { border-color: var(--accent); }
    @keyframes slideIn { to { opacity:1; transform:translateY(0); } }

    /* Card top */
    .card-top {
      padding: 16px 18px 14px;
      display: flex; align-items: center; gap: 12px;
    }
    .card-badge {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
      transition: background .2s ease;
    }
    .card.done .card-badge { background: var(--success); }
    .card-info { flex: 1; min-width: 0; }
    .card-pos { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); margin-bottom: 2px; }
    .card-name { font-size: 17px; font-weight: 700; letter-spacing: -.02em; color: var(--text1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .done-check {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: var(--success);
      display: none; align-items: center; justify-content: center;
    }
    .done-check svg { width: 11px; height: 11px; }
    .card.done .done-check { display: flex; }

    .sep { height: 1px; background: var(--sep); margin: 0 18px; }

    /* ── STARS ──────────────────────────────────────────────── */
    .stars-section { padding: 14px 18px 12px; }
    .field-lbl {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--text2); margin-bottom: 12px;
    }
    .stars-row { display: flex; gap: 7px; }
    .star-btn {
      width: 46px; height: 46px; border-radius: 13px; border: none; cursor: pointer;
      background: var(--input-bg); border: 1px solid var(--input-b);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, border-color .2s,
                  transform .18s cubic-bezier(.34,1.56,.64,1);
      outline: none;
    }
    .star-btn:active { transform: scale(.8); }
    .star-btn svg { width: 22px; height: 22px; fill: var(--input-b); transition: fill .15s ease; }
    .star-btn.lit { background: var(--accent-10); border-color: var(--accent-20); }
    .star-btn.lit svg { fill: var(--accent); }

    /* ── TEXTAREA ───────────────────────────────────────────── */
    .text-section { padding: 0 18px 14px; }
    .text-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .char-count { font-size: 11px; font-weight: 600; color: var(--text3); transition: color .2s; }
    .review-ta {
      width: 100%; min-height: 90px;
      background: var(--input-bg); border: 1px solid var(--input-b);
      border-radius: var(--r-input); padding: 13px 15px;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 16px; /* 16px prevents iOS zoom */
      font-weight: 400; color: var(--text1); line-height: 1.5;
      resize: none; outline: none; -webkit-appearance: none; appearance: none;
      transition: border-color .2s, box-shadow .2s, background .25s;
    }
    .review-ta::placeholder { color: var(--text3); font-size: 15px; }
    .review-ta:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-10);
    }

    /* ── PHOTO ──────────────────────────────────────────────── */
    .photo-section { padding: 0 18px 18px; }
    .photo-zone {
      border: 1.5px dashed var(--input-b);
      border-radius: var(--r-input); overflow: hidden; cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .photo-zone:active, .photo-zone.drag { border-color: var(--accent); background: var(--accent-10); }
    .photo-inner {
      display: flex; align-items: center; gap: 13px; padding: 13px 15px;
    }
    .cam-icon-wrap {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: var(--accent-10);
      display: flex; align-items: center; justify-content: center;
    }
    /* Clean camera SVG */
    .cam-icon-wrap svg { width: 20px; height: 20px; color: var(--accent); }
    .photo-label { font-size: 14px; font-weight: 600; color: var(--text1); flex: 1; }
    .pts-badge {
      font-size: 11px; font-weight: 700; color: var(--accent);
      background: var(--accent-10); border: 1px solid var(--accent-20);
      border-radius: 7px; padding: 4px 9px; flex-shrink: 0;
    }
    .photo-img { width: 100%; height: 175px; object-fit: cover; display: none; }

    /* ── SUBMIT ─────────────────────────────────────────────── */
    .submit-wrap {
      max-width: 480px; margin: 0 auto;
      padding: 0 14px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      display: none;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .submit-wrap.show { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) forwards; }

    .info-row {
      background: var(--card); border: 1px solid var(--card-b);
      border-radius: var(--r-card); padding: 14px 16px;
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
      transition: background .25s, border-color .25s;
    }
    .info-ic {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      background: var(--accent-10);
      display: flex; align-items: center; justify-content: center;
    }
    .info-ic svg { width: 15px; height: 15px; color: var(--accent); }
    .info-text { font-size: 13px; color: var(--text2); line-height: 1.45; }

    .terms-label {
      background: var(--card); border: 1px solid var(--card-b);
      border-radius: var(--r-card); padding: 14px 16px;
      display: flex; align-items: flex-start; gap: 12px;
      cursor: pointer; margin-bottom: 12px;
      transition: background .25s, border-color .25s;
    }
    .terms-cb { display: none; }
    .chk {
      width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
      border: 1.5px solid var(--input-b);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
    }
    .terms-cb:checked ~ .chk { background: var(--accent); border-color: var(--accent); }
    .chk svg { width: 11px; height: 11px; display: none; }
    .terms-cb:checked ~ .chk svg { display: block; }
    .terms-text { font-size: 13px; color: var(--text2); line-height: 1.45; }

    .submit-btn {
      width: 100%; height: 56px; border: none; border-radius: var(--r-btn);
      background: var(--accent); color: #fff;
      font-family: 'Outfit', system-ui, sans-serif;
      font-size: 16px; font-weight: 700; letter-spacing: -.01em;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      cursor: pointer; outline: none;
      box-shadow: 0 4px 20px rgba(255,107,53,.3);
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .submit-btn:active:not(:disabled) {
      transform: scale(.97);
      background: var(--accent-d);
      box-shadow: 0 2px 10px rgba(255,107,53,.2);
    }
    .submit-btn:disabled { opacity: .4; cursor: default; box-shadow: none; }

    /* Utils */
    .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-msg { text-align: center; font-size: 13px; font-weight: 600; color: var(--danger); margin-top: 8px; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-5px); }
      40%,80% { transform: translateX(5px); }
    }
    .shake { animation: shake .35s ease; }
    .spacer { height: 30px; }
  </style>
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-body">
      <div class="logo-dot">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      </div>
      <div class="header-info">
        <div class="header-shop" id="shop-lbl">Магазин</div>
        <div class="header-title">Оставьте отзыв</div>
      </div>
      <div class="header-right">
        <div class="counter-pill">
          <span id="done-c">0</span> / <span id="total-c">0</span>
        </div>
        <a href="profile.html" class="profile-link" aria-label="Профиль" id="profile-link">
          <div class="profile-btn" id="profile-btn">
            <svg class="profile-btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Сменить тему">
          <svg id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/>
          </svg>
          <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="prog-bar" style="width:0%"></div>
      </div>
    </div>
  </header>

  <!-- ── Cards ── -->
  <main class="main" id="cards"></main>

  <!-- ── Submit ── -->
  <div class="submit-wrap" id="submit-wrap">
    <div class="info-row">
      <div class="info-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <div class="info-text">Поинты начисляются сразу после отправки. Чем подробнее — тем больше.</div>
    </div>

    <label class="terms-label" id="terms-lbl">
      <input type="checkbox" class="terms-cb" id="terms-cb">
      <div class="chk">
        <svg fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <div class="terms-text">Согласен с условиями обработки персональных данных и публикацией отзыва</div>
    </label>

    <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">
      Отправить и получить поинты
    </button>
  </div>

  <div class="spacer"></div>

  <script>
    // ── Theme ────────────────────────────────────────────────
    const theme0 = localStorage.getItem('theme') || 'dark';
    applyTheme(theme0);

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('ico-moon').style.display = t === 'dark'  ? 'block' : 'none';
      document.getElementById('ico-sun').style.display  = t === 'light' ? 'block' : 'none';
    }
    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('theme', next);
    }
    window.addEventListener('pageshow', () => applyTheme(localStorage.getItem('theme') || 'dark'));
    window.addEventListener('storage', e => { if (e.key === 'theme') applyTheme(e.newValue || 'dark'); });

    // ── Auth: redirect to login if no session, then load user points ──
    const _sb = supabase.createClient(
      'https://jtzmekaeyggbyodgtybl.supabase.co',
      'sb_publishable_H0ssO-N5HaRdTAZpT3UaSQ_EDtis45e'
    );
    let _userEmail = null;
    let _authToken = null;
    (async () => {
      const { data: { session } } = await _sb.auth.getSession();
      if (!session) {
        const next = encodeURIComponent(location.pathname + location.search);
        location.href = '/login.html?next=' + next;
        return;
      }
      _userEmail = session.user.email;
      _authToken = session.access_token;

      // Load user's points via backend (uses users table, bypasses RLS)
      try {
        const res = await fetch('/user/me', { headers: { 'Authorization': 'Bearer ' + _authToken } });
        const json = await res.json();
        const pts = json.data?.points || 0;
        if (pts > 0) {
          const btn = document.getElementById('profile-btn');
          btn.innerHTML = `
            <div class="profile-btn-num">${pts > 999 ? '999+' : pts}</div>
            <div class="profile-btn-sub">pts</div>
          `;
        }
      } catch (e) { /* non-critical */ }
    })();

    // ── Data ─────────────────────────────────────────────────
    const p     = new URLSearchParams(location.search);
    const shop  = p.get('shop') || '';
    const items = (p.get('items') || 'Товар 1,Товар 2').split(',').map(s => s.trim()).filter(Boolean);
    const state = Object.fromEntries(items.map((name, i) => [i, { name, stars:0, text:'', photo:null, done:false }]));

    document.getElementById('shop-lbl').textContent  = shop ? `Магазин #${shop}` : 'Ваш заказ';
    document.getElementById('total-c').textContent   = items.length;

    // ── Progress ─────────────────────────────────────────────
    function progress() {
      const done = Object.values(state).filter(s => s.done).length;
      document.getElementById('done-c').textContent   = done;
      document.getElementById('prog-bar').style.width = items.length ? `${done/items.length*100}%` : '0%';
      const w = document.getElementById('submit-wrap');
      if (done === items.length) {
        if (!w.classList.contains('show')) {
          w.style.display = 'block';
          w.classList.add('show');
          setTimeout(() => w.scrollIntoView({ behavior:'smooth', block:'nearest' }), 80);
        }
      } else {
        w.style.display = 'none';
        w.classList.remove('show');
      }
    }

    function syncDone(i) {
      const s = state[i];
      const was = s.done;
      s.done = s.stars > 0 && s.text.trim().length >= 10;
      if (s.done !== was) document.getElementById(`card-${i}`).classList.toggle('done', s.done);
      progress();
    }

    // ── Stars ────────────────────────────────────────────────
    function setStars(i, v) {
      state[i].stars = v;
      for (let k = 1; k <= 5; k++)
        document.getElementById(`st-${i}-${k}`).classList.toggle('lit', k <= v);
      syncDone(i);
    }

    // ── Text ─────────────────────────────────────────────────
    function onText(i, el) {
      state[i].text = el.value;
      const n = el.value.trim().length;
      const c = document.getElementById(`cc-${i}`);
      c.textContent = n;
      c.style.color = n >= 10 ? 'var(--success)' : n > 0 ? 'var(--accent)' : 'var(--text3)';
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
      syncDone(i);
    }

    // ── Photo ────────────────────────────────────────────────
    function onPhoto(i, file) {
      if (!file?.type.startsWith('image/')) return;
      state[i].photo = file;
      const r = new FileReader();
      r.onload = e => {
        const img  = document.getElementById(`img-${i}`);
        const hint = document.getElementById(`hint-${i}`);
        img.src = e.target.result; img.style.display = 'block'; hint.style.display = 'none';
      };
      r.readAsDataURL(file);
    }

    // ── Render cards ─────────────────────────────────────────
    function render() {
      const el = document.getElementById('cards');
      el.innerHTML = items.map((name, i) => `
        <div class="card" id="card-${i}" style="animation-delay:${i*70}ms">

          <div class="card-top">
            <div class="card-badge" id="badge-${i}">${i+1}</div>
            <div class="card-info">
              <div class="card-pos">позиция ${i+1}</div>
              <div class="card-name">${name}</div>
            </div>
            <div class="done-check">
              <svg fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
          </div>

          <div class="sep"></div>

          <div class="stars-section">
            <div class="field-lbl">Оценка</div>
            <div class="stars-row">
              ${[1,2,3,4,5].map(k=>`
                <button class="star-btn" id="st-${i}-${k}" onclick="setStars(${i},${k})" aria-label="${k} звёзд">
                  <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                </button>`).join('')}
            </div>
          </div>

          <div class="sep"></div>

          <div class="text-section" style="padding-top:14px">
            <div class="text-top">
              <div class="field-lbl" style="margin-bottom:0">Комментарий</div>
              <span class="char-count" id="cc-${i}">0</span>
            </div>
            <div style="height:10px"></div>
            <textarea class="review-ta" rows="3"
              placeholder="Расскажите подробнее — вкус, атмосфера, подача..."
              oninput="onText(${i}, this)"></textarea>
          </div>

          <div class="sep" style="margin-top:14px"></div>

          <div class="photo-section" style="padding-top:14px">
            <div class="field-lbl">Фото</div>
            <div class="photo-zone" id="zone-${i}"
                 onclick="document.getElementById('file-${i}').click()"
                 ondragover="event.preventDefault();this.classList.add('drag')"
                 ondragleave="this.classList.remove('drag')"
                 ondrop="event.preventDefault();this.classList.remove('drag');onPhoto(${i},event.dataTransfer.files[0])">
              <div class="photo-inner" id="hint-${i}">
                <div class="cam-icon-wrap">
                  <!-- Clean camera icon -->
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                  </svg>
                </div>
                <div class="photo-label">Добавить фото</div>
                <div class="pts-badge">+10 pts</div>
              </div>
              <img class="photo-img" id="img-${i}" alt="Фото отзыва">
            </div>
            <input type="file" id="file-${i}" accept="image/*" capture="environment"
                   style="display:none" onchange="onPhoto(${i},this.files[0])">
          </div>

        </div>
      `).join('');
    }

    // ── Submit ────────────────────────────────────────────────
    async function handleSubmit() {
      const cb = document.getElementById('terms-cb');
      if (!cb.checked) {
        const lbl = document.getElementById('terms-lbl');
        lbl.classList.remove('shake'); void lbl.offsetWidth; lbl.classList.add('shake');
        lbl.style.borderColor = 'var(--danger)';
        setTimeout(() => { lbl.style.borderColor=''; lbl.classList.remove('shake'); }, 1400);
        return;
      }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<div class="spinner"></div><span>Отправляем...</span>`;
      try {
        const res  = await fetch('/review', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            shop,
            email: _userEmail,
            reviews: Object.values(state).map(s => ({ item:s.name, stars:s.stars, text:s.text, hasPhoto:!!s.photo })),
          }),
        });
        const json = await res.json();
        if (json.success) {
          const r = encodeURIComponent(JSON.stringify(json.data?.results ?? []));
          location.href = `/thanks.html?points=${json.data?.points??0}&results=${r}`;
        }
        else throw new Error(json.error || 'Ошибка при отправке');
      } catch(err) {
        btn.disabled = false;
        btn.innerHTML = 'Отправить и получить поинты';
        const msg = document.createElement('p');
        msg.className = 'err-msg'; msg.textContent = err.message;
        btn.after(msg); setTimeout(() => msg.remove(), 4000);
      }
    }

    render();
    progress();
  </script>
</body>
</html>
