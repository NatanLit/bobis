<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Оставить отзыв</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Manrope', 'sans-serif'] },
          colors: {
            surface: '#F2F2F7',
            card: '#FFFFFF',
            label: '#1C1C1E',
            secondary: '#6C6C70',
            tertiary: '#AEAEB2',
            separator: '#E5E5EA',
            accent: '#007AFF',
            success: '#30D158',
            warn: '#FF9F0A',
            danger: '#FF3B30',
          },
          borderRadius: { '3xl': '1.5rem', '4xl': '2rem' },
          boxShadow: {
            'card': '0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06)',
            'card-active': '0 2px 8px rgba(0,122,255,0.15), 0 0 0 1.5px #007AFF',
          },
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Manrope', sans-serif;
      background: #F2F2F7;
      min-height: 100dvh;
    }

    /* Subtle ambient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 15% 10%, rgba(0,122,255,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 85% 90%, rgba(48,209,88,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Frosted header */
    .header-blur {
      background: rgba(242,242,247,0.82);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }

    /* Card entrance */
    .review-card {
      opacity: 0;
      transform: translateY(20px) scale(0.99);
      animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Star buttons */
    .star-btn { transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .star-btn:active { transform: scale(0.8); }
    .star-btn svg { transition: fill 0.15s ease, filter 0.15s ease; }
    .star-btn.lit svg {
      fill: #FF9F0A;
      filter: drop-shadow(0 1px 4px rgba(255,159,10,0.45));
    }
    .star-btn.unlit svg { fill: #E5E5EA; }

    /* Textarea */
    textarea {
      resize: none;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    textarea:focus {
      border-color: #007AFF !important;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
    }

    /* Photo zone */
    .photo-zone { transition: border-color 0.2s ease, background 0.2s ease; }
    .photo-zone:active { background: rgba(0,122,255,0.04); }

    /* Progress bar */
    .progress-fill {
      transition: width 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
      background: linear-gradient(90deg, #007AFF 0%, #30D158 100%);
    }

    /* Submit button */
    .submit-btn {
      background: #007AFF;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 20px rgba(0,122,255,0.35);
    }
    .submit-btn:active:not(:disabled) {
      transform: scale(0.97);
      background: #0071E3;
      box-shadow: 0 2px 10px rgba(0,122,255,0.25);
    }
    .submit-btn:disabled {
      background: #AEAEB2;
      box-shadow: none;
    }

    /* Done card badge */
    .card-done { box-shadow: 0 0 0 1.5px #30D158, 0 4px 16px rgba(48,209,88,0.1); }

    /* Char counter color transition */
    .char-count { transition: color 0.2s ease; }

    /* Spinner */
    .spinner {
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Safe area bottom */
    .safe-bottom { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }

    /* Shake animation for validation */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* Checkbox */
    .check-box {
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    input:checked ~ .check-box {
      background: #007AFF;
      border-color: #007AFF;
    }

    /* Slide up for submit section */
    #submit-section {
      animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header-blur sticky top-0 z-30 border-b border-separator"
          style="padding-top: env(safe-area-inset-top)">
    <div class="max-w-lg mx-auto px-5 pt-3 pb-2">
      <div class="flex items-center justify-between mb-2">
        <div>
          <p class="text-xs font-semibold text-tertiary tracking-widest uppercase" id="shop-label">...</p>
          <h1 class="text-xl font-bold text-label leading-tight">Оставьте отзыв</h1>
        </div>
        <div class="text-right">
          <p class="text-xs text-tertiary mb-0.5">заполнено</p>
          <p class="text-base font-bold text-label tabular-nums">
            <span id="done-count">0</span><span class="text-tertiary font-medium"> / <span id="total-count">0</span></span>
          </p>
        </div>
      </div>
      <!-- Progress bar -->
      <div class="h-1 bg-separator rounded-full overflow-hidden">
        <div class="progress-fill h-full rounded-full" id="progress-bar" style="width:0%"></div>
      </div>
    </div>
  </header>

  <!-- Cards -->
  <main class="relative z-10 max-w-lg mx-auto px-4 py-5 space-y-4" id="cards-container"></main>

  <!-- Submit -->
  <div class="relative z-10 max-w-lg mx-auto px-4 safe-bottom" id="submit-section" style="display:none">
    <!-- Points hint -->
    <div class="bg-card rounded-3xl px-5 py-4 shadow-card mb-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-2xl bg-warn/10 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#FF9F0A" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/>
          </svg>
        </div>
        <p class="text-sm text-secondary leading-snug">
          Поинты начисляются сразу после отправки. Чем подробнее — тем больше.
        </p>
      </div>
    </div>

    <!-- Terms -->
    <label class="bg-card rounded-3xl px-5 py-4 shadow-card mb-3 flex items-start gap-3 cursor-pointer active:opacity-70 transition-opacity" id="terms-label">
      <input type="checkbox" id="terms-cb" class="sr-only peer">
      <div class="check-box mt-0.5 w-5 h-5 rounded-md border-2 border-separator flex items-center justify-center flex-shrink-0">
        <svg class="w-3 h-3 text-white hidden peer-checked:block" id="check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <span class="text-sm text-secondary leading-snug">
        Согласен с условиями обработки персональных данных и публикацией отзыва
      </span>
    </label>

    <button id="submit-btn" class="submit-btn w-full rounded-3xl py-4 text-white font-bold text-base flex items-center justify-center gap-2.5" onclick="handleSubmit()">
      Отправить и получить поинты
    </button>
  </div>

  <div class="h-6"></div>

  <script>
    // ── Parse URL params ──────────────────────────────────────────
    const params    = new URLSearchParams(window.location.search);
    const shopId    = params.get('shop') || '';
    const rawItems  = params.get('items') || 'Товар 1,Товар 2,Товар 3';
    const items     = rawItems.split(',').map(s => s.trim()).filter(Boolean);

    // ── State ─────────────────────────────────────────────────────
    const state = {};
    items.forEach((name, i) => {
      state[i] = { name, stars: 0, text: '', photo: null, done: false };
    });

    // ── DOM refs ──────────────────────────────────────────────────
    document.getElementById('shop-label').textContent  = shopId ? `Магазин #${shopId}` : 'Ваш заказ';
    document.getElementById('total-count').textContent = items.length;

    // ── Progress ──────────────────────────────────────────────────
    function updateProgress() {
      const done = Object.values(state).filter(s => s.done).length;
      document.getElementById('done-count').textContent = done;
      document.getElementById('progress-bar').style.width = items.length
        ? `${(done / items.length) * 100}%` : '0%';

      if (done === items.length) {
        const sec = document.getElementById('submit-section');
        if (sec.style.display === 'none') {
          sec.style.display = 'block';
          setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }
      }
    }

    function checkDone(idx) {
      const s      = state[idx];
      const isDone = s.stars > 0 && s.text.trim().length >= 10;
      const card   = document.getElementById(`card-${idx}`);

      if (isDone && !s.done) {
        card.classList.add('card-done');
        s.done = true;
      } else if (!isDone) {
        card.classList.remove('card-done');
        s.done = false;
      }
      updateProgress();
    }

    // ── Stars ─────────────────────────────────────────────────────
    function setStars(idx, val) {
      state[idx].stars = val;
      for (let i = 1; i <= 5; i++) {
        const btn = document.getElementById(`star-${idx}-${i}`);
        btn.classList.toggle('lit', i <= val);
        btn.classList.toggle('unlit', i > val);
      }
      checkDone(idx);
    }

    // ── Text ──────────────────────────────────────────────────────
    function onTextInput(idx, el) {
      state[idx].text     = el.value;
      const len           = el.value.trim().length;
      const counter       = document.getElementById(`counter-${idx}`);
      counter.textContent = `${len}`;
      counter.style.color = len >= 10 ? '#30D158' : len > 0 ? '#FF9F0A' : '#AEAEB2';

      // Auto-grow textarea
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';

      checkDone(idx);
    }

    // ── Photo ─────────────────────────────────────────────────────
    function onPhoto(idx, file) {
      if (!file || !file.type.startsWith('image/')) return;
      state[idx].photo = file;

      const reader  = new FileReader();
      reader.onload = e => {
        const preview = document.getElementById(`preview-${idx}`);
        const zone    = document.getElementById(`photo-zone-${idx}`);
        preview.src              = e.target.result;
        preview.style.display    = 'block';
        zone.querySelector('.photo-hint').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    // ── Render cards ──────────────────────────────────────────────
    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.id    = `card-${idx}`;
        card.className = 'review-card bg-card rounded-3xl shadow-card overflow-hidden';
        card.style.animationDelay = `${idx * 70}ms`;

        card.innerHTML = `
          <!-- Card header -->
          <div class="px-5 pt-5 pb-4 flex items-start gap-3">
            <div class="w-10 h-10 rounded-2xl bg-accent/8 flex items-center justify-center flex-shrink-0" style="background:rgba(0,122,255,0.08)">
              <span class="text-xs font-bold text-accent">${idx + 1}</span>
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-xs font-semibold text-tertiary uppercase tracking-wider mb-0.5">позиция ${idx + 1}</p>
              <h2 class="text-lg font-bold text-label leading-snug truncate">${item}</h2>
            </div>
          </div>

          <div class="h-px bg-separator mx-5"></div>

          <!-- Stars -->
          <div class="px-5 pt-4 pb-3">
            <p class="text-xs font-semibold text-secondary uppercase tracking-wider mb-2.5">Оценка</p>
            <div class="flex gap-2">
              ${[1,2,3,4,5].map(i => `
                <button class="star-btn unlit w-11 h-11 rounded-2xl bg-surface flex items-center justify-center"
                        id="star-${idx}-${i}"
                        onclick="setStars(${idx}, ${i})"
                        aria-label="${i} звезд">
                  <svg class="w-6 h-6" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="h-px bg-separator mx-5"></div>

          <!-- Review text -->
          <div class="px-5 pt-4 pb-3">
            <div class="flex items-center justify-between mb-2">
              <p class="text-xs font-semibold text-secondary uppercase tracking-wider">Комментарий</p>
              <div class="flex items-center gap-1">
                <span class="char-count text-xs font-semibold" id="counter-${idx}" style="color:#AEAEB2">0</span>
                <span class="text-xs text-tertiary">симв.</span>
              </div>
            </div>
            <textarea
              id="text-${idx}"
              rows="3"
              class="w-full rounded-2xl bg-surface border border-separator px-4 py-3 text-sm font-medium text-label placeholder-tertiary leading-relaxed"
              placeholder="Расскажите подробнее — вкус, подача, что понравилось или что можно улучшить..."
              oninput="onTextInput(${idx}, this)"
            ></textarea>
          </div>

          <div class="h-px bg-separator mx-5"></div>

          <!-- Photo -->
          <div class="px-5 pt-4 pb-5">
            <p class="text-xs font-semibold text-secondary uppercase tracking-wider mb-2.5">
              Фото
              <span class="text-tertiary font-medium normal-case tracking-normal"> — необязательно, +10 поинтов</span>
            </p>
            <div id="photo-zone-${idx}"
                 class="photo-zone rounded-2xl border-2 border-dashed border-separator cursor-pointer overflow-hidden"
                 onclick="document.getElementById('file-${idx}').click()"
                 ondragover="event.preventDefault();this.classList.add('!border-accent')"
                 ondragleave="this.classList.remove('!border-accent')"
                 ondrop="event.preventDefault();this.classList.remove('!border-accent');onPhoto(${idx},event.dataTransfer.files[0])">
              <div class="photo-hint flex items-center gap-3 px-4 py-3.5">
                <div class="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0" style="background:rgba(0,122,255,0.1)">
                  <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                </div>
                <div>
                  <p class="text-sm font-semibold text-label">Добавить фото</p>
                  <p class="text-xs text-tertiary">JPG, PNG до 10 МБ</p>
                </div>
              </div>
              <img id="preview-${idx}" src="" alt="Превью фото"
                   class="w-full h-44 object-cover" style="display:none">
            </div>
            <input type="file" id="file-${idx}" accept="image/*" capture="environment" class="sr-only"
                   onchange="onPhoto(${idx}, this.files[0])">
          </div>
        `;

        container.appendChild(card);
      });
    }

    // ── Terms checkbox ────────────────────────────────────────────
    document.getElementById('terms-cb').addEventListener('change', function() {
      document.getElementById('check-icon').style.display = this.checked ? 'block' : 'none';
    });

    // ── Submit ────────────────────────────────────────────────────
    async function handleSubmit() {
      const cb = document.getElementById('terms-cb');
      if (!cb.checked) {
        const label = document.getElementById('terms-label');
        label.classList.add('shake');
        label.style.outline = '1.5px solid #FF3B30';
        label.style.borderRadius = '1.5rem';
        setTimeout(() => {
          label.classList.remove('shake');
          label.style.outline = '';
        }, 1500);
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<div class="spinner w-5 h-5 rounded-full flex-shrink-0"></div><span>Отправляем...</span>`;

      try {
        const payload = {
          shop: shopId,
          reviews: Object.values(state).map(s => ({
            item:     s.name,
            stars:    s.stars,
            text:     s.text,
            hasPhoto: Boolean(s.photo),
          })),
        };

        const res  = await fetch('/review', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(payload),
        });

        const json = await res.json();
        if (json.success) {
          window.location.href = `/thanks.html?points=${json.data?.points ?? 0}`;
        } else {
          throw new Error(json.error || 'Ошибка при отправке');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Отправить и получить поинты';

        const msg       = document.createElement('p');
        msg.className   = 'mt-2 text-center text-sm font-semibold text-danger';
        msg.textContent = err.message || 'Что-то пошло не так — попробуйте ещё раз';
        btn.after(msg);
        setTimeout(() => msg.remove(), 4000);
      }
    }

    // ── Init ──────────────────────────────────────────────────────
    renderCards();
    updateProgress();
  </script>
</body>
</html>
