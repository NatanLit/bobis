<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ — Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --accent: #FF8C00; --accent-d: #E67E00; --accent-10: rgba(255,140,0,.1); --danger: #EF4444; }
    [data-theme="dark"] {
      --bg: #0A0A0A; --card: #141414; --card-b: #262626;
      --text1: #F5F5F5; --text2: #A3A3A3; --text3: #525252;
      --input-bg: #1A1A1A; --input-b: #333;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text1);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 380px; width: 100%; }

    .logo {
      width: 64px; height: 64px; border-radius: 20px;
      background: var(--accent); margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(255,140,0,.25);
      animation: pop .45s cubic-bezier(.34,1.56,.64,1) both;
    }
    .logo svg { width: 30px; height: 30px; color: #fff; }
    @keyframes pop { from { transform: scale(0); opacity: 0; } }

    .title { font-size: 24px; font-weight: 800; letter-spacing: -.03em; text-align: center; margin-bottom: 4px; animation: up .4s .1s both; }
    .sub   { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 28px; animation: up .4s .15s both; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .card {
      background: var(--card); border: 1px solid var(--card-b);
      border-radius: 20px; padding: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
      animation: up .4s .2s both;
    }
    .lbl {
      font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text2); margin-bottom: 8px;
    }
    .input {
      width: 100%; height: 50px;
      background: var(--input-bg); border: 1px solid var(--input-b);
      border-radius: 12px; padding: 0 16px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px; font-weight: 500; color: var(--text1);
      outline: none; letter-spacing: .05em;
      transition: border-color .2s, box-shadow .2s;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-10); }
    .input::placeholder { color: var(--text3); letter-spacing: 0; }

    .btn {
      width: 100%; height: 50px; border: none; border-radius: 14px;
      background: var(--accent); color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; margin-top: 16px;
      box-shadow: 0 4px 20px rgba(255,140,0,.25);
      transition: transform .15s, background .15s, opacity .15s;
    }
    .btn:active { transform: scale(.97); background: var(--accent-d); }
    .btn:disabled { opacity: .4; cursor: default; }

    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .err { font-size: 13px; font-weight: 600; color: var(--danger); text-align: center; margin-top: 10px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>
    <div class="title">Панель управления</div>
    <div class="sub">Введите пароль для доступа</div>

    <div class="card">
      <div class="lbl">Пароль</div>
      <input class="input" id="pwd-input" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn" id="btn" onclick="handleLogin()">Войти</button>
      <div class="err" id="err-msg"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('pwd-input');
    const btn   = document.getElementById('btn');
    const err   = document.getElementById('err-msg');

    if (sessionStorage.getItem('admin_auth') === '1') location.href = '/admin.html';

    input.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    async function handleLogin() {
      const pwd = input.value.trim();
      if (!pwd) { err.textContent = 'Введите пароль'; return; }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';
      err.textContent = '';

      try {
        const res  = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd }),
        });
        const json = await res.json();
        if (json.success) {
          sessionStorage.setItem('admin_auth', '1');
          sessionStorage.setItem('admin_key', pwd);
          location.href = '/admin.html';
        } else {
          err.textContent = 'Неверный пароль';
          btn.disabled = false;
          btn.textContent = 'Войти';
          input.focus();
        }
      } catch {
        err.textContent = 'Ошибка соединения';
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    }
  </script>
</body>
</html>
